name: Distribute Android (Firebase App Distribution)

# OPTIONAL and UNUSED until the repository has a GitHub remote. Manual trigger only: it never runs on
# push or pull request. It builds the signed release APK of apps/mobile (Kinfall) and uploads it to
# Firebase App Distribution with scripts/distribute-android.sh, exactly like a local run.
#
# Only one repository secret is needed: DOPPLER_TOKEN, a read-only Doppler service token for
# kinfall/prd. Every other value (keystore, passwords, Firebase app id, service account) stays in
# Doppler. Setup and rollback: docs/distribution.md.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only, upload nothing"
        type: boolean
        default: true
      groups:
        description: "App Distribution groups (comma separated)"
        type: string
        default: testers

permissions:
  contents: read

concurrency:
  group: distribute-android
  cancel-in-progress: false

jobs:
  distribute:
    name: Build the release APK and distribute
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The version code is the commit count: it needs the whole history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: dopplerhq/cli-action@v3
      - run: npm ci
      - name: Build, sign and upload
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIST_GROUPS: ${{ inputs.groups }}
        run: |
          set -euo pipefail
          test -n "$DOPPLER_TOKEN" || { echo "::error::Repository secret DOPPLER_TOKEN is not set (see docs/distribution.md)"; exit 1; }
          args=(--config prd --groups "$DIST_GROUPS")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          bash scripts/distribute-android.sh "${args[@]}"
