name: CI

# Checks only: nothing here signs, uploads a build or uses a secret. The one artifact is the
# Playwright report of a failed web e2e run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (typecheck, tests, golden files)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Root project plus every workspace (core, web, mobile).
      - run: npm run typecheck
      - run: npm test
      # The engine is deterministic: regenerating the golden files must leave them byte-identical.
      - name: Golden files are up to date
        run: |
          npm run golden:update
          npm run golden:runs
          git diff --exit-code -- packages/core/tests/golden

  web:
    name: Web (build, size)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run size

  web-e2e:
    name: Web e2e (Chromium, Firefox, WebKit)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  mobile:
    name: Mobile (Jest, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @webgames/mobile
      - run: npm run test:mobile -- --ci

  android-debug:
    name: Android debug build (no signing key, not uploaded)
    needs: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Caches Gradle's dependencies and wrapper, and validates the wrapper's checksum.
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        working-directory: .
      # android/ is generated here and never committed (see .gitignore).
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
      # Debug variant only: signed with the SDK's throwaway debug key, never a release key. One ABI
      # (the emulator's) keeps the native build of Skia and Hermes within the time limit.
      - name: Assemble the debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=x86_64
