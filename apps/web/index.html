<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Kinfall</title>
  </head>
  <body>
    <div class="app" id="app">
      <header class="hud">
        <h1 class="title" data-i18n="app.title">Kinfall</h1>
        <div class="hud__party" id="hud-party"></div>
        <div class="hud__buttons">
          <!-- Back to the game hub; shown only on Kinfall's title screen. -->
          <button type="button" class="hud__btn hud__btn--text" id="hud-games" data-i18n="hub.games" hidden>Games</button>
          <button type="button" class="hud__btn hud__btn--text" id="hud-log" data-i18n="battle.openLog" hidden>Log</button>
          <!-- Opens the sheet of the visible run screen (options, run details); its label comes from the screen. -->
          <button type="button" class="hud__btn hud__btn--text" id="hud-run" hidden></button>
          <button type="button" class="hud__btn" id="hud-settings" data-i18n-label="hud.settings" aria-label="Settings"><span aria-hidden="true">&#9881;</span></button>
          <button type="button" class="hud__btn" id="hud-fullscreen" data-i18n-label="hud.fullscreen" aria-label="Enter fullscreen" hidden><span aria-hidden="true">&#9974;</span></button>
        </div>
      </header>

      <!-- The settings controls live here while the sheet is closed; the HUD button lends them to it. -->
      <div id="settings-store" hidden>
        <section class="settings" id="settings-panel">
          <label class="setting">
            <span data-i18n="settings.language">Language</span>
            <select id="lang">
              <option value="en" lang="en">English</option>
              <option value="es" lang="es">Español</option>
            </select>
          </label>
          <label class="setting setting--check">
            <input type="checkbox" id="reduce-motion" />
            <span data-i18n="settings.reduceMotion">Reduce motion</span>
          </label>
          <label class="setting">
            <span data-i18n="settings.textSize">Text size</span>
            <input type="range" id="text-size" min="80" max="150" step="10" value="100" />
            <output id="text-size-value" for="text-size">100%</output>
          </label>
        </section>
      </div>

      <p class="sr-only" data-announcer aria-live="polite" aria-atomic="true"></p>

      <main class="screens" id="screens">
        <div id="save-warning" role="status">
          <div class="save-warning" hidden>
            <p></p>
            <button type="button" class="secondary" data-i18n="save.dismiss">Dismiss</button>
          </div>
        </div>

        <section class="screen" data-screen="hub" id="screen-hub" hidden></section>
        <section class="screen" data-screen="title" id="screen-title" hidden></section>
        <section class="screen" data-screen="map" id="screen-map" hidden></section>

        <section class="battle" data-screen="battle" id="screen-battle" hidden>
          <section class="stage">
            <div class="scene" id="scene"></div>
            <p class="summary sr-only" id="summary"></p>
          </section>

          <!-- In the console layout the log is a one-line message over the stage; the HUD's Log button lends the
               same live region (#log) to a sheet with the full history and takes it back on close. -->
          <section class="log-panel" id="log-panel" aria-labelledby="log-title">
            <h2 class="panel-title" id="log-title" data-i18n="battle.log">Battle log</h2>
            <div class="log" id="log" role="log" aria-live="polite" aria-labelledby="log-title" tabindex="0"></div>
          </section>

          <section class="menu-panel" id="menu-panel" aria-labelledby="prompt">
            <h2 class="prompt" id="prompt"></h2>
            <p class="intent sr-only" id="intent"></p>
            <div class="choices" id="choices"></div>
            <div class="result" id="result" hidden>
              <h2 class="result-title" id="result-title" tabindex="-1"></h2>
              <p class="result-note" id="result-note"></p>
              <button type="button" class="primary" id="new-battle" data-i18n="battle.new">New battle</button>
            </div>
          </section>

          <nav class="dpad" id="dpad" aria-labelledby="dpad-title">
            <h2 class="sr-only" id="dpad-title" data-i18n="controls.label">On-screen controls</h2>
            <div class="dpad-cross">
              <button type="button" class="pad pad--up" data-action="up" data-i18n-label="controls.up" aria-label="Up">▲</button>
              <button type="button" class="pad pad--left" data-action="left" data-i18n-label="controls.left" aria-label="Left">◀</button>
              <button type="button" class="pad pad--right" data-action="right" data-i18n-label="controls.right" aria-label="Right">▶</button>
              <button type="button" class="pad pad--down" data-action="down" data-i18n-label="controls.down" aria-label="Down">▼</button>
            </div>
            <div class="dpad-buttons">
              <button type="button" class="pad pad--wide" data-action="swap" data-i18n="menu.swap">Swap</button>
              <button type="button" class="pad pad--wide" data-action="back" data-i18n="menu.back">Back</button>
              <button type="button" class="pad pad--wide pad--confirm" data-action="confirm" data-i18n="controls.confirm">Confirm</button>
            </div>
          </nav>

          <div class="battle-footer" id="battle-footer" hidden></div>
        </section>

        <section class="screen" data-screen="event" id="screen-event" hidden></section>
        <section class="screen" data-screen="end" id="screen-end" hidden></section>

        <section class="run-log-panel" id="run-log-panel" aria-labelledby="run-log-title" hidden>
          <h2 class="panel-title" id="run-log-title" data-i18n="map.log">Run log</h2>
          <div class="log run-log" id="run-log" role="log" aria-live="polite" aria-labelledby="run-log-title" tabindex="-1"></div>
        </section>
      </main>

      <footer class="footer">
        <p id="seed"></p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
