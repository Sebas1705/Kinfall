# Launches the app with no saved data, taps Play on the game hub (Kinfall is focused first) and waits
# for the title screen. The debug build loads its JavaScript from Metro, so the first frame can take a while.
appId: es.sebas1705.kinfall
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "hub-screen"
    timeout: 60000
- tapOn:
    id: "hub-play"
- extendedWaitUntil:
    visible:
      id: "title-screen"
    timeout: 10000
